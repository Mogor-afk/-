<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --pink: #ec4899;
    --pink-deep: #db2777;
    --violet: #8b5cf6;
    --violet-soft: #a78bfa;
    --gold: #f59e0b;
    --ink: #43385c;
    --ink-soft: #7b7398;
    --card: rgba(255,255,255,.82);
    --shadow: 0 10px 28px rgba(139,92,246,.18);
  }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg,#ffd9ef 0%,#f4e3ff 48%,#dcd6ff 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* 背景装饰层 */
  .deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .deco .star { position: absolute; }
  .wrap { position: relative; z-index: 2; width: 100%; max-width: 560px; margin: 0 auto; padding: 28px 18px 48px; }

  /* 卡片通用 */
  .card {
    background: var(--card);
    border-radius: 26px;
    box-shadow: var(--shadow);
    padding: 26px 20px;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.6);
  }

  /* 视图切换 */
  .view { display: none; }
  .view.active { display: block; animation: rise .45s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px);} to { opacity: 1; transform: none;} }

  /* 欢迎页 */
  .brand { text-align: center; }
  .brand .moon-icon { width: 64px; height: 64px; margin: 0 auto 10px; display: block; }
  .brand h1 { font-size: 30px; letter-spacing: 2px; color: var(--violet); margin: 6px 0 8px; }
  .brand .sub { color: var(--ink-soft); font-size: 15px; line-height: 1.7; }
  .brand .stars { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 10px; }

  /* 按钮 */
  .btn {
    display: block; width: 100%; padding: 15px 0;
    border: none; border-radius: 999px; cursor: pointer;
    font-size: 17px; font-weight: 700; color: #fff;
    background: linear-gradient(90deg,var(--pink),var(--violet));
    box-shadow: 0 8px 18px rgba(236,72,153,.35);
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 22px rgba(236,72,153,.4); }
  .btn:active { transform: translateY(0); }
  .btn.ghost { background: #fff; color: var(--violet); border: 1.5px solid var(--violet-soft); box-shadow: none; }

  /* 进度 */
  .progress { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .progress .bar { flex: 1; height: 8px; background: rgba(139,92,246,.18); border-radius: 8px; overflow: hidden; }
  .progress .bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg,var(--pink),var(--violet)); border-radius: 8px; transition: width .4s; }
  .progress .txt { font-size: 13px; color: var(--ink-soft); font-weight: 700; }

  /* 题目 */
  .qtitle { font-size: 21px; font-weight: 800; color: var(--ink); line-height: 1.5; margin-bottom: 20px; }
  .options { display: grid; gap: 12px; }
  .opt {
    display: flex; align-items: center; gap: 12px;
    padding: 15px 16px; border-radius: 18px; cursor: pointer;
    background: #fff; border: 2px solid rgba(139,92,246,.14);
    font-size: 16px; color: var(--ink); font-weight: 600;
    transition: border-color .15s, transform .1s, background .15s;
    min-height: 52px;
  }
  .opt .ic { font-size: 22px; width: 26px; text-align: center; color: var(--violet); }
  .opt:hover { border-color: var(--violet-soft); }
  .opt.sel { border-color: var(--pink); background: #fff0f7; }
  .opt.sel .ic { color: var(--pink); }
  .hint { margin-top: 16px; text-align: center; font-size: 13px; color: var(--ink-soft); }

  .result-scroll { position: relative; z-index: 2; width: 100%; max-width: 560px; margin: 0 auto; padding: 34px 18px 48px; }
  .badge { display: inline-block; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.75); color: var(--violet); font-size: 13px; font-weight: 800; letter-spacing: 1px; }
  .sign {
    margin-top: 14px; padding: 26px 18px; border-radius: 24px;
    background: linear-gradient(135deg,rgba(255,255,255,.88),rgba(244,227,255,.72));
    box-shadow: var(--shadow); text-align: center;
  }
  .sign .grade { color: var(--gold); font-weight: 800; font-size: 15px; letter-spacing: 2px; }
  .sign .text { font-size: 30px; font-weight: 900; color: var(--violet); margin: 8px 0 4px; }
  .sign .guide { font-size: 15px; color: var(--ink); line-height: 1.8; }

  .panel { margin-top: 14px; padding: 20px 18px; border-radius: 24px; background: rgba(255,255,255,.85); box-shadow: var(--shadow); }
  .panel h3 { font-size: 15px; color: var(--violet); margin-bottom: 14px; font-weight: 800; }
  .stat { margin-bottom: 12px; }
  .stat .row { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink); margin-bottom: 5px; }
  .stat .row b { color: var(--pink-deep); }
  .stat .track { height: 9px; background: rgba(139,92,246,.14); border-radius: 8px; overflow: hidden; }
  .stat .track i { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg,var(--pink),var(--violet)); }
  .luck { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
  .luck .it { background: #fff0f7; border-radius: 16px; padding: 12px 8px; text-align: center; }
  .luck .it .k { font-size: 12px; color: var(--ink-soft); }
  .luck .it .v { font-size: 16px; font-weight: 800; color: var(--violet); margin-top: 4px; }
  .yj { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .yj .box { border-radius: 16px; padding: 14px; font-size: 14px; line-height: 1.8; }
  .yj .box b { display: block; margin-bottom: 4px; font-size: 15px; }
  .yj .do { background: #f0fdf4; color: #15803d; }
  .yj .do b { color: #16a34a; }
  .yj .avoid { background: #fff1f2; color: #be123c; }
  .yj .avoid b { color: #e11d48; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .shot-box { margin-top: 18px; text-align: center; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.75); border: 1.5px dashed rgba(130,90,190,.5); }
  .shot-line { margin: 0; color: var(--violet); font-weight: 700; font-size: 15px; }
  .shot-sub { margin: 6px 0 0; color: rgba(60,52,92,.55); font-size: 12px; }
  .foot { margin-top: 12px; text-align: center; color: rgba(60,52,92,.6); font-size: 12px; }

  /* 解锁页 */
  .lock-card { text-align: center; }
  .lock-card .lock-ic { width: 64px; height: 64px; margin: 6px auto 12px; display: block; }
  .lock-card h2 { font-size: 22px; color: var(--violet); margin-bottom: 8px; }
  .lock-card .sub { color: var(--ink-soft); font-size: 14px; line-height: 1.7; margin-bottom: 18px; }
  .code-input {
    width: 100%; padding: 15px 14px; border-radius: 14px;
    border: 2px solid rgba(139,92,246,.25); outline: none;
    font-size: 18px; font-weight: 800; letter-spacing: 2px; text-align: center;
    color: var(--violet); background: #fff;
  }
  .code-input:focus { border-color: var(--violet); }
  .err { margin-top: 10px; color: #e11d48; font-size: 13px; min-height: 18px; }
  .lock-hint { margin-top: 16px; color: rgba(60,52,92,.55); font-size: 12px; line-height: 1.7; }

  @media (max-width: 480px) {
    .luck { grid-template-columns: repeat(3,1fr); }
    .sign .text { font-size: 25px; }
  }
</style>
</head>

  function shuffle(a) {
    var arr = a.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  // 确定性伪随机：同一种子结果稳定，用于按日期抽取当天固定的题
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function pickBySeed(pool, n, seed) {
    var rnd = mulberry32(seed);
    var arr = pool.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr.slice(0, n);
  }

  function showView(v) {

      box.appendChild(d);
    });

      else { state.q++; renderQ(); }
    }, 450);

    return { g: g, sign: sign, stats: stats, do: g.do[idx], avoid: g.avoid[idx], guide: guide, color: color, num: num, dir: dir };
  }

    function pad(n){ return n < 10 ? "0" + n : "" + n; }

  }

  function codeHash(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) >>> 0;
